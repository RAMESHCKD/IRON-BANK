{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">Edit <span>Customer</span></div>
            <p class="auth-subtitle">Update account details for {{ customer.name }}</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ customer.name }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="phone">Phone</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ customer.phone or '' }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ customer.email }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="address">Address</label>
                <textarea class="form-control" id="address" name="address" rows="3">{{ customer.address or '' }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="user_id">User ID</label>
                <input type="text" class="form-control" id="user_id" name="user_id" value="{{ customer.user_id }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="pin">PIN</label>
                <input type="text" class="form-control" id="pin" name="pin" value="{{ customer.pin or '' }}" maxlength="4" required>
            </div>

            <div class="btn-group">
                <a href="{{ url_for('admin.dashboard') }}" class="btn-outline">Cancel</a>
                <button type="submit" class="btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
