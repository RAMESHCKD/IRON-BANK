{% extends "base.html" %}

{% block title %}Secure Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="fa-solid fa-building-columns text-accent"></i> IRON<span>BANK</span></div>
            <div class="auth-subtitle">Secure Gateway &bull; Login Portal</div>
        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="user_id" class="form-label">USER ID</label>
                <input type="text" id="user_id" name="user_id" class="form-control" placeholder="Enter User ID" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">PASSWORD</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>
            
            <div class="form-group" style="margin-top: 1.5rem;">
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Verify Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
